{% extends 'base.html' %}

{% block title %}Create Review{% endblock %}

{% block content %}

    <h1>Create Review</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn create-btn">
            Submit Review
        </button>

        <a href="{% url 'weddings:details' pk=view.kwargs.pk %}"
           class="btn cancel-btn">
            Cancel
        </a>
    </form>

{% endblock %}
