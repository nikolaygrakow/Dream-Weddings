{% extends 'base.html' %}

{% block title %}Delete Service{% endblock %}

{% block content %}
    <h1>Delete Service</h1>

    <p>Are you sure you want to delete this service?</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Confirm Delete</button>
        <a href="{% url 'services:details' service.pk %}" class="btn cancel-btn">
            Cancel
        </a>
    </form>
{% endblock %}
