{% extends 'base.html' %}

{% block title %}Check Your Email{% endblock %}

{% block content %}
<section class="account-section login-page">
    <div class="account-container">
        <div class="account-header">
            <h1>Check Your Email</h1>
            <p>If an account exists with the email address you provided,
                you will receive a password reset link shortly.</p>
            <p>Please check your inbox and spam folder.</p>
        </div>

        <div class="account-footer">
            <p>
                <a href="{% url 'accounts:login' %}">Back to Sign In</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
