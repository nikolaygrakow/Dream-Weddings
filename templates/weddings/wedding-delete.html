{% extends 'base.html' %}

{% block title %}Delete Wedding{% endblock %}

{% block content %}
    <h1>Delete Wedding</h1>

    <p>Are you sure you want to delete this wedding?</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Confirm Delete</button>
        <a href="{% url 'weddings:details' wedding.pk %}" class="btn cancel-btn">
            Cancel
        </a>
    </form>
{% endblock %}
