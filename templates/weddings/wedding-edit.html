{% extends 'base.html' %}

{% block title %}Edit Wedding Package{% endblock %}

{% block content %}
    <h1>Edit Wedding Package</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save Changes</button>
        <a href="{% url 'weddings:details' wedding.pk %}" class="btn cancel-btn">
            Cancel
        </a>

    </form>
{% endblock %}
