{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}

    <title>{% block title %}{% endblock %}</title>

</head>
<body>
    {% block navigation %}
        {% include 'nav.html' %}
    {% endblock %}

    <main class="content">
        {% block content %}
        {% endblock %}
    </main>

    {% block footer %}
        {% include 'footer.html' %}
    {% endblock %}

</body>
</html>
